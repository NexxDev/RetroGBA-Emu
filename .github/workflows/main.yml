
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'emulador-gba.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          set -euo pipefail
          mkdir -p unpacked
          unzip -oq emulador-gba.zip -d unpacked
          test -f unpacked/settings.gradle.kts

      - name: Compilar APK
        run: gradle -p unpacked assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroCore-APK
          path: unpacked/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
